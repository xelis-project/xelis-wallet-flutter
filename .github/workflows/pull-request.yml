name: Pull request validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Flutter minimum
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
          pub-cache: true

      - name: Test release evidence checker
        run: node --test tool/ci/release_evidence.test.cjs

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Resolve dependencies
        run: flutter pub get

      - name: Detect Rust changes
        id: rust-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git diff --quiet "$BASE_SHA" HEAD -- rust; then
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test tool bin hook

      - name: Analyze Dart and Flutter
        run: dart analyze

      - name: Test Android alignment checker
        run: dart tool/test_android_16k.dart

      - name: Check Rust formatting
        if: steps.rust-changes.outputs.changed == 'true'
        working-directory: rust
        run: cargo fmt --check

      - name: Test Rust
        if: steps.rust-changes.outputs.changed == 'true'
        working-directory: rust
        run: cargo test --locked

      - name: Test Flutter and native loading
        run: dart tool/test_native.dart

      - name: Check whitespace
        run: git diff --check
