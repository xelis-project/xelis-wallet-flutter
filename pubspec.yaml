name: xelis_wallet_flutter
description: Shared Flutter bindings for the native XELIS wallet runtime.
version: 0.1.2
repository: https://github.com/xelis-project/xelis-wallet-flutter
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.12.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  build_runner: ^2.15.1
  freezed: 3.2.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
